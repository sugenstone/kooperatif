[package]
name = "kooperatif-server"
version = "0.1.0"
edition = "2021"
description = "Kooperatif backend API server"
publish = false

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["ws"] }
base64ct = { version = "1", features = ["alloc"] }
rand = "0.8"
rpassword = "7"
rust_decimal = "1.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "time",
    "uuid",
    "rust_decimal",
] }
thiserror = "2"
time = { version = "0.3", features = [
    "formatting",
    "parsing",
    "macros",
    "serde",
    "serde-well-known",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
uuid = { version = "1", features = ["serde"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "trace", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Real WebSocket client for live-socket integration tests (STEP-016).
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

# The future Rust worker process (ADR-009, ADR-012) will join this Cargo
# workspace as a sibling binary/crate sharing this package's library
# (domain/application/infrastructure code), NOT a second backend codebase.
